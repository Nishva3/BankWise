services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongodb_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["${API_PORT:-5000}:5000"]
    volumes: [bankwise_uploads:/app/uploads, bankwise_models:/app/models]
    depends_on:
      mongo: {condition: service_healthy}
volumes:
  mongodb_data:
  bankwise_uploads:
  bankwise_models:
